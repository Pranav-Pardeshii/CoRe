[project]
name = "core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncmy>=0.2.18",
    "bcrypt==4.0.1",
    "fastapi>=0.139.0",
    "mysql-connector-python>=9.7.0",
    "pandas>=3.0.3",
    "passlib[bcrypt]==1.7.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.2",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.1.9",
    "streamlit>=1.59.1",
    "streamlit-cookies-manager>=0.2.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "etl/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests requiring a real MySQL database via CORE_TEST_DATABASE_URL",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "etl"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pyright]
pythonVersion = "3.12"
include = ["backend/app", "backend/tests", "etl"]
typeCheckingMode = "standard"
